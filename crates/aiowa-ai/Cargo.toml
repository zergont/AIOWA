[package]
name = "aiowa-ai"
description = "ИИ-слой AIOWA: шлюз моделей — подключения к Anthropic и OpenAI-совместимым серверам, поток ответа, политика приватности, запись обращений в журнал"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
sha2.workspace = true
secrecy.workspace = true

[dev-dependencies]
# Фейковые серверы моделей в тестах: TCP на 127.0.0.1:0, как у транспорта OWA.
tokio = { workspace = true, features = ["net", "io-util"] }
