[package]
name = "aiowa-transport-owa"
description = "Транспорт поверх внутреннего JSON API Outlook Web App (Exchange 2019)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aiowa-core.workspace = true
aiowa-transport.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
url.workspace = true
percent-encoding.workspace = true
tracing.workspace = true
thiserror.workspace = true
secrecy.workspace = true
jiff.workspace = true
base64.workspace = true

[dev-dependencies]
# Фейковый сервер OWA в интеграционных тестах (tests/common): TCP на 127.0.0.1:0.
tokio = { workspace = true, features = ["net", "io-util"] }
# Полная синхронизация движком через настоящий транспорт во временную базу.
aiowa-sync.workspace = true
aiowa-store.workspace = true
