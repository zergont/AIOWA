# Выпуск по метке версии `v*`: установщик NSIS, подпись обновления ключом обновлений, `latest.json`
# для модуля обновления в приложении (tauri-plugin-updater) и релиз GitHub с этими файлами.
#
# Метку ставит автор после того, как версия поднята в tauri.conf.json, Cargo.toml и package.json:
#   git tag -a v0.2.0 -F docs/releases/v0.2.0.md
#   git push origin v0.2.0
# «Что нового» берётся из docs/releases/<метка>.md, а если файла нет — из текста аннотированной метки.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — содержимое файла закрытого ключа обновлений (обязателен);
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — пароль ключа; у ключа без пароля секрет не заводится;
#   AIOWA_SIGN_PFX_BASE64, AIOWA_SIGN_PFX_PASSWORD — сертификат подписи кода .pfx в base64 и его
#                                        пароль (необязательно: без них установщик без Authenticode).
# Метка с дефисом (v0.3.0-rc.1) — предварительный выпуск: установленные копии его не видят,
# адрес `releases/latest` указывает только на обычные выпуски.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Выпуск (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # checkout кладёт метку облегчённой; текст аннотированной метки нужен для «что нового».
      - name: Метка целиком
        run: git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"

      - name: Версия
        id: version
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($conf -ne $version -or $pkg -ne $version -or $cargo -ne $version) {
            Write-Error "Метка $tag не совпадает с версией: tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Зависимости фронтенда
        working-directory: apps/desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # Сертификат подписи кода — по желанию: scripts/sign.ps1 без него подпись пропускает.
      - name: Сертификат подписи кода
        env:
          PFX_BASE64: ${{ secrets.AIOWA_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "Сертификат подписи кода не задан: установщик будет без подписи Authenticode"
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'aiowa-sign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "AIOWA_SIGN_PFX=$path" >> $env:GITHUB_ENV

      # tauri build: фронтенд (beforeBuildCommand), приложение, установщик NSIS (каждый .exe — через
      # sign.ps1), затем подпись установщика ключом обновлений (createUpdaterArtifacts) — файл .sig.
      # Без ключа сборка падает на последнем шаге: такой выпуск установленные копии не примут.
      # Ключ не от той пары tauri-cli только предупреждает («does not match the public key») и
      # сборку не роняет — здесь это отказ; номер ключа в .sig ещё раз сверяет шаг перед релизом.
      - name: Сборка
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIOWA_SIGN_PFX_PASSWORD: ${{ secrets.AIOWA_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "Нет секрета TAURI_SIGNING_PRIVATE_KEY: без подписи обновления выпуск не собирается"
            exit 1
          }
          $log = Join-Path $env:RUNNER_TEMP 'tauri-build.log'
          # Вывод — и в журнал CI, и в файл для проверки; строки stderr — как текст (tauri-cli пишет
          # туда и ход сборки, это не ошибки: исход — только код выхода).
          $ErrorActionPreference = 'Continue'
          npx tauri build --ci 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($code -ne 0) { exit $code }
          if (Select-String -Path $log -SimpleMatch -Quiet -Pattern 'does not match the public key') {
            Write-Error "Ключ обновлений в секрете TAURI_SIGNING_PRIVATE_KEY не от пары к открытому ключу plugins.updater.pubkey: такой выпуск отвергнут все установленные копии"
            exit 1
          }

      - name: latest.json и «что нового»
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $dir = 'target/release/bundle/nsis'
          $exe = Get-ChildItem $dir -Filter "*_$($env:VERSION)_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Установщик версии $env:VERSION не найден в $dir"; exit 1 }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { Write-Error "Нет подписи обновления $sig"; exit 1 }

          $notesFile = "docs/releases/$($env:TAG).md"
          if (Test-Path $notesFile) {
            $notes = Get-Content $notesFile -Raw -Encoding utf8
          } else {
            $notes = (git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' $env:TAG) -join "`n"
          }
          $notes = ($notes -replace "`r`n", "`n").Trim()
          if (-not $notes) { $notes = "Версия $env:VERSION" }

          $url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:TAG)/$($exe.Name)"
          $platform = [ordered]@{ signature = (Get-Content $sig -Raw).Trim(); url = $url }
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64'      = $platform
              'windows-x86_64-nsis' = $platform
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8NoBOM
          $notes | Set-Content -Path release-notes.md -Encoding utf8NoBOM
          Get-FileHash $exe.FullName -Algorithm SHA256 | ForEach-Object { Write-Host "SHA256 $($exe.Name): $($_.Hash)" }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "sig=$sig" >> $env:GITHUB_OUTPUT

      # Подпись обновления сверяется так же, как её проверит приложение, до того как выпуск
      # опубликован: номер ключа (keynum) в .sig равен номеру открытого ключа из tauri.conf.json, а
      # доверенный комментарий подписи несёт версию выпуска (requireSignedVersion). Открытый ключ в
      # конфиге и .sig — base64 от текстовых файлов minisign; вторая строка каждого — снова base64:
      # 2 байта алгоритма, 8 байт номера ключа, дальше ключ или подпись. Сравниваются байты как есть
      # (KeyNum), а в сообщениях номер — как его печатают minisign и `tauri signer` («minisign public
      # key: …»): те же 8 байт числом little-endian, то есть в обратном порядке, hex в верхнем регистре.
      - name: Подпись обновления — тем ключом и с версией
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIG: ${{ steps.files.outputs.sig }}
        run: |
          function Read-Minisign([string]$b64, [string]$what) {
            try {
              $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64.Trim()))
              $lines = @($text -split "`r?`n")
              $bytes = [Convert]::FromBase64String($lines[1].Trim())
            } catch {
              throw "$what не читается как файл minisign в base64: $($_.Exception.Message)"
            }
            if ($bytes.Length -lt 10) { throw "${what}: во второй строке меньше 10 байт" }
            [pscustomobject]@{
              KeyNum = [BitConverter]::ToString($bytes, 2, 8)
              KeyId  = -join ($bytes[9..2] | ForEach-Object { $_.ToString('X2') })
              Lines  = $lines
            }
          }
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pub = Read-Minisign $conf.plugins.updater.pubkey 'Открытый ключ plugins.updater.pubkey'
          $sig = Read-Minisign (Get-Content $env:SIG -Raw) "Подпись $env:SIG"
          if ($sig.KeyNum -ne $pub.KeyNum) {
            Write-Error "Установщик подписан не тем ключом: номер ключа подписи $($sig.KeyId), открытого ключа $($pub.KeyId). Секрет TAURI_SIGNING_PRIVATE_KEY не от пары к plugins.updater.pubkey — такой выпуск отвергнут все установленные копии"
            exit 1
          }
          $trusted = $sig.Lines | Where-Object { $_ -like 'trusted comment:*' } | Select-Object -First 1
          if (-not $trusted -or -not (($trusted -split "`t") -contains "version:$($env:VERSION)")) {
            Write-Error "В подписи нет версии $($env:VERSION) (requireSignedVersion): установленные копии её отвергнут"
            exit 1
          }
          Write-Host "Подпись обновления: ключ $($sig.KeyId) совпадает с открытым, версия $($env:VERSION) подписана"

      # Сначала черновик со всеми файлами, потом публикация: адрес releases/latest не должен указать
      # на выпуск, у которого ещё нет latest.json или установщика. Повторный запуск по той же метке
      # заменяет файлы существующего выпуска.
      - name: Релиз GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          EXE: ${{ steps.files.outputs.exe }}
          SIG: ${{ steps.files.outputs.sig }}
        run: |
          $files = @($env:EXE, $env:SIG, 'latest.json')
          $existing = @(gh release list --limit 200 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing -contains $env:TAG) {
            gh release upload $env:TAG @files --clobber
          } else {
            $create = @('release', 'create', $env:TAG) + $files + @('--title', "AIOWA $env:VERSION", '--notes-file', 'release-notes.md', '--draft', '--verify-tag')
            if ($env:PRERELEASE -eq 'true') { $create += '--prerelease' }
            gh @create
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publish = @('release', 'edit', $env:TAG, '--draft=false', '--notes-file', 'release-notes.md')
          if ($env:PRERELEASE -ne 'true') { $publish += '--latest' }
          gh @publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
