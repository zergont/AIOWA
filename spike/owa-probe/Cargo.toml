[package]
name = "owa-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
keyring = "4.2.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["blocking", "cookies", "json", "gzip", "form", "query", "native-tls", "charset", "http2", "system-proxy"], default-features = false }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
url = "2.5.8"
