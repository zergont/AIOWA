[package]
name = "aiowa-desktop"
description = "AIOWA: настольное приложение (Tauri 2)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "aiowa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
aiowa-core.workspace = true
aiowa-store.workspace = true
aiowa-sync.workspace = true
aiowa-transport.workspace = true
aiowa-transport-owa.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ammonia.workspace = true
keyring.workspace = true
secrecy.workspace = true
tokio.workspace = true
base64.workspace = true
percent-encoding.workspace = true
url.workspace = true
# Открытие файлов и ссылок системным приложением: через ShellExecuteExW, а не через cmd/powershell.
open = { version = "5", features = ["shellexecute-on-windows"] }
# Системный диалог «Сохранить как». Без фич по умолчанию (они нужны только Linux: xdg-portal, wayland);
# на Windows бэкенд IFileDialog работает без фич.
rfd = { version = "0.17", default-features = false }
# Папка «Загрузки» пользователя (известная папка Windows) для диалога сохранения.
dirs = "7"
# Тосты Windows о новых письмах (канал уведомлений, `notify.rs`); вызывается из Rust, не из окна.
# В сборке из `target/debug` тост выходит от имени PowerShell (плагин ставит AppUserModelID только
# установленному приложению).
tauri-plugin-notification = "2"
# Один экземпляр на пользователя: второй запуск не открывает базу и сессию OWA ещё раз, а
# поднимает уже открытое окно (две копии делили бы базу, отложенные действия и лимит сессий ящика).
tauri-plugin-single-instance = "2"
