[package]
name = "aiowa-desktop"
description = "AIOWA: настольное приложение (Tauri 2)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "aiowa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
aiowa-core.workspace = true
aiowa-store.workspace = true
aiowa-sync.workspace = true
aiowa-transport.workspace = true
aiowa-transport-owa.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
jiff.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ammonia.workspace = true
keyring.workspace = true
secrecy.workspace = true
tokio.workspace = true
base64.workspace = true
percent-encoding.workspace = true
url.workspace = true
# Внешние картинки писем по кнопке (`external_images.rs`): отдельный клиент без cookies и Referer.
reqwest.workspace = true
# Открытие файлов и ссылок системным приложением: через ShellExecuteExW, а не через cmd/powershell.
open = { version = "5", features = ["shellexecute-on-windows"] }
# Системный диалог «Сохранить как». Без фич по умолчанию (они нужны только Linux: xdg-portal, wayland);
# на Windows бэкенд IFileDialog работает без фич.
rfd = { version = "0.17", default-features = false }
# Папка «Загрузки» пользователя (известная папка Windows) для диалога сохранения.
dirs = "7"
# Тосты Windows о новых письмах (канал уведомлений, `notify.rs`); вызывается из Rust, не из окна.
# В сборке из `target/debug` тост выходит от имени PowerShell (плагин ставит AppUserModelID только
# установленному приложению).
tauri-plugin-notification = "2"
# Один экземпляр на пользователя: второй запуск не создаёт окно и сессию OWA, а поднимает уже
# открытое окно (две копии синхронизировали бы одну базу, делили бы отложенные действия и лимит
# сессий ящика). Базу второй запуск всё же открывает: учётная запись читается до проверки экземпляра.
tauri-plugin-single-instance = "2"
# Журнал в файл с ежедневной ротацией (`logging.rs`): у собранного приложения нет консоли.
tracing-appender = "0.2"
# Обновление из приложения (`updates.rs`): `latest.json` релиза GitHub, загрузка установщика, проверка
# подписи ключом обновлений (minisign) и запуск установщика NSIS. TLS системный (Schannel), как у
# транспорта OWA: без rustls и ring; zip не нужен — обновление приходит самим установщиком `.exe`.
# Прокси — системный. Команды плагина окну не открыты (capability не даёт `updater:*`): окно зовёт
# только свои команды `updates_*`.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }

# Выключение браузерных клавиш WebView2 в главном окне (`lib.rs`, `disable_browser_accelerator_keys`).
# Версии — те же, что у wry и tauri в Cargo.lock: `PlatformWebview::controller` отдаёт тип webview2-com.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
